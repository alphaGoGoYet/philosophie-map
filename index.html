<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas de la pensée occidentale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #c8c4bc;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --text: #1a1a1a;
      --muted: #6b7280;
      --header-h: 72px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 100;
      background: rgba(200,196,188,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: #111111; }
    .header-sub { font-size: 12px; color: #444444; font-weight: 500; margin-top: 2px; }

    .header-right { display: flex; align-items: center; gap: 14px; }

    #search {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text);
      width: 260px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    #search:focus { border-color: rgba(0,0,0,0.25); }
    #search::placeholder { color: var(--muted); }

    .mode-badge {
      font-size: 11px;
      color: var(--muted);
      background: rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      white-space: nowrap;
    }

    /* VIEWPORT */
    #viewport {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #viewport.detail { cursor: grab; }
    #viewport.detail.dragging { cursor: grabbing; }

    /* CANVAS */
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 10200px;
      height: 3000px;
      transform-origin: 0 0;
    }
    #canvas.animated { transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

    /* NODES */
    .node {
      position: absolute;
      width: 240px;
      border-radius: 14px;
      padding: 13px 15px;
      border: 1px solid rgba(0,0,0,0.12);
      background: #ffffff;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18), 0 1px 3px rgba(0,0,0,0.12);
    }
    #viewport.detail .node {
      pointer-events: auto;
      cursor: pointer;
    }
    #viewport.detail .node:hover {
      border-color: rgba(0,0,0,0.28);
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .node.concept {
      border-style: dashed;
      background: #fafaf8;
    }
    .node.dimmed { opacity: 0.1; }

    .node-domain {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 7px;
    }
    .node-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      color: #111111;
    }
    .node.concept .node-name { font-style: italic; }
    .node-era { font-size: 11px; color: #555555; font-weight: 500; margin-top: 2px; }
    .node-tags { margin-top: 9px; display: flex; flex-direction: column; gap: 3px; }
    .node-tag {
      font-size: 11px;
      color: #222222;
      font-weight: 500;
      background: rgba(0,0,0,0.06);
      border-radius: 5px;
      padding: 3px 7px;
    }

    /* SVG */
    #links-svg {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }

    /* HOVER RECT */
    #hover-rect {
      position: absolute;
      border: 2px solid rgba(0,0,0,0.5);
      border-radius: 6px;
      pointer-events: none;
      display: none;
      background: rgba(0,0,0,0.02);
      box-shadow: 0 0 0 9999px rgba(255,255,255,0.35);
    }

    /* PANEL */
    #panel {
      position: fixed;
      top: calc(var(--header-h) + 14px);
      right: 14px;
      width: 340px;
      max-height: calc(100vh - var(--header-h) - 28px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      z-index: 200;
      overflow-y: auto;
      display: none;
      scrollbar-width: thin;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    #panel.open { display: block; }

    .panel-header { padding-right: 28px; }
    .panel-name { font-size: 22px; font-weight: 700; line-height: 1.2; color: #111111; }
    .panel-meta { font-size: 13px; color: #444444; font-weight: 500; margin-top: 5px; }

    #panel-close {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(0,0,0,0.06);
      border: none;
      color: var(--muted);
      font-size: 14px;
      width: 26px; height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #panel-close:hover { background: rgba(0,0,0,0.12); color: var(--text); }

    .panel-section {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444444;
      margin: 16px 0 7px;
    }
    .panel-concepts { display: flex; flex-direction: column; gap: 5px; }
    .panel-concept {
      font-size: 13px;
      font-weight: 500;
      background: rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: #111111;
    }
    .panel-nodes { display: flex; flex-wrap: wrap; gap: 5px; }
    .panel-node-btn {
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(0,0,0,0.2);
      background: rgba(0,0,0,0.04);
      border-radius: 999px;
      padding: 5px 12px;
      color: #111111;
      cursor: pointer;
      font-family: inherit;
    }
    .panel-node-btn:hover { background: rgba(0,0,0,0.1); }

    .panel-description {
      font-size: 13px;
      line-height: 1.65;
      color: #222222;
    }
    .panel-quote {
      margin: 8px 0;
      padding: 10px 14px;
      border-left: 3px solid #aaaaaa;
      background: rgba(0,0,0,0.03);
      border-radius: 0 8px 8px 0;
    }
    .panel-quote p {
      font-size: 13px;
      font-style: italic;
      line-height: 1.6;
      color: #222222;
    }
    .panel-quote cite {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      color: #666666;
      font-style: normal;
      font-weight: 500;
    }
    .panel-biblio {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .panel-biblio li {
      font-size: 12px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--border);
      border-radius: 7px;
    }
    .bib-title { color: #111111; font-weight: 600; }
    .bib-year  { color: #666666; font-weight: 400; }

    /* LEGEND */
    #legend {
      position: fixed;
      bottom: 14px;
      left: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 580px;
      z-index: 50;
      pointer-events: none;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 10px;
      color: #374151;
    }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-title">Atlas de la pensée occidentale</div>
    <div class="header-sub" id="header-sub">Cliquer pour zoomer</div>
  </div>
  <div class="header-right">
    <input id="search" type="text" placeholder="Rechercher un penseur ou concept…" autocomplete="off">
    <div class="mode-badge" id="mode-badge">Vue d'ensemble</div>
  </div>
</header>

<div id="viewport">
  <div id="canvas">
    <svg id="links-svg" width="10200" height="3000"></svg>
  </div>
  <div id="hover-rect"></div>
</div>

<div id="panel">
  <button id="panel-close">✕</button>
  <div id="panel-content"></div>
</div>

<div id="legend"></div>

<script>
let DATA;

// ─── Fetch helpers ───────────────────────────────────────────────────────────
async function fetchText(url) {
  try { const r = await fetch(url); return r.ok ? await r.text() : null; }
  catch { return null; }
}
async function fetchJSON(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; }
  catch { return null; }
}
function renderMd(text) {
  return text.trim()
    .split(/\n\n+/)
    .map(p => '<p>' + p
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      + '</p>')
    .join('');
}

// ─── Constants ───────────────────────────────────────────────────────────────
const CANVAS_W     = 10200;
const CANVAS_H     = 3000;
const HEADER_H     = 72;
const SCALE_MIN    = 0.3;
const SCALE_MAX    = 2.0;
const SCALE_ENTRY  = 0.65;

// ─── State ────────────────────────────────────────────────────────────────────
let mode         = 'overview';
let detailScale  = SCALE_ENTRY;
let detailOffset = { x: 0, y: 0 };
let isDragging   = false;
let dragStart    = { x: 0, y: 0 };
let dragOrigin   = { x: 0, y: 0 };
let searchQuery  = '';

let nodeMap;

// ─── Helpers ─────────────────────────────────────────────────────────────────
function vp() { return { w: window.innerWidth, h: window.innerHeight - HEADER_H }; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function overviewScale() {
  const v = vp();
  return Math.min(v.w / CANVAS_W, v.h / CANVAS_H) * 0.96;
}
function overviewOffset(s) {
  const v = vp(); s = s ?? overviewScale();
  return { x: (v.w - CANVAS_W * s) / 2, y: (v.h - CANVAS_H * s) / 2 };
}

// ─── Transform ───────────────────────────────────────────────────────────────
function applyTransform(animated) {
  const canvas  = document.getElementById('canvas');
  const vport   = document.getElementById('viewport');
  const badge   = document.getElementById('mode-badge');
  const sub     = document.getElementById('header-sub');
  const hRect   = document.getElementById('hover-rect');

  canvas.classList.toggle('animated', !!animated);

  if (mode === 'overview') {
    const s = overviewScale();
    const o = overviewOffset(s);
    canvas.style.transform = `translate(${o.x}px,${o.y}px) scale(${s})`;
    vport.className = '';
    badge.textContent = 'Vue d\'ensemble';
    sub.textContent   = 'Cliquer pour zoomer · Echap pour recherche';
    hRect.style.display = 'none';
  } else {
    canvas.style.transform = `translate(${detailOffset.x}px,${detailOffset.y}px) scale(${detailScale})`;
    vport.className = 'detail';
    badge.textContent = `Zoom ${Math.round(detailScale * 100)}%`;
    sub.textContent   = 'Glisser · Double-clic ou Echap pour revenir';
    hRect.style.display = 'none';
  }
}

// ─── Zoom ─────────────────────────────────────────────────────────────────────
function zoomTo(canvasX, canvasY) {
  detailScale = SCALE_ENTRY;
  const v = vp();
  canvasX = clamp(canvasX, v.w / detailScale / 2, CANVAS_W - v.w / detailScale / 2);
  canvasY = clamp(canvasY, v.h / detailScale / 2, CANVAS_H - v.h / detailScale / 2);
  detailOffset = {
    x: v.w / 2 - canvasX * detailScale,
    y: v.h / 2 - canvasY * detailScale
  };
  mode = 'detail';
  applyTransform(true);
}

function zoomOut() {
  mode = 'overview';
  closePanel();
  applyTransform(true);
}

// ─── Hover rect ───────────────────────────────────────────────────────────────
function updateHoverRect(screenX, screenY) {
  const v = vp();
  const s = overviewScale();
  const rw = (v.w / detailScale) * s;
  const rh = (v.h / detailScale) * s;
  const r  = document.getElementById('hover-rect');
  r.style.cssText = `display:block;width:${rw}px;height:${rh}px;left:${screenX - rw/2}px;top:${screenY - rh/2}px;`;
}

// ─── Search ───────────────────────────────────────────────────────────────────
function applySearch(q) {
  searchQuery = q;
  const lq = q.toLowerCase();
  const matchIds = new Set(
    DATA.nodes
      .filter(n => n.name.toLowerCase().includes(lq) || n.concepts.some(c => c.toLowerCase().includes(lq)))
      .map(n => n.id)
  );
  document.querySelectorAll('.node').forEach(el => {
    el.classList.toggle('dimmed', q !== '' && !matchIds.has(el.dataset.id));
  });
  document.querySelectorAll('#links-svg path').forEach(p => {
    const active = q === '' || (matchIds.has(p.dataset.s) && matchIds.has(p.dataset.t));
    p.setAttribute('stroke', active ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.05)');
  });
}

// ─── Panel ────────────────────────────────────────────────────────────────────
function renderPanel(node, color, outs, ins, rich) {
  const btns = (arr) => arr.map(n =>
    `<button class="panel-node-btn" data-id="${n.id}">${n.name}</button>`
  ).join('');

  const descHTML = rich.description
    ? `<div class="panel-section">Pensée</div><div class="panel-description">${renderMd(rich.description)}</div>`
    : '';

  const quotesHTML = rich.quotes && rich.quotes.length
    ? `<div class="panel-section">Extraits</div>`
      + rich.quotes.map(q => `
        <blockquote class="panel-quote">
          <p>"${q.text}"</p>
          <cite>${q.source}</cite>
        </blockquote>`).join('')
    : '';

  const bibHTML = rich.bibliography && rich.bibliography.length
    ? `<div class="panel-section">Bibliographie</div><ul class="panel-biblio">`
      + rich.bibliography.map(b => `<li><span class="bib-title">${b.title}</span> <span class="bib-year">(${b.year})</span></li>`).join('')
      + `</ul>`
    : '';

  document.getElementById('panel-content').innerHTML = `
    <div class="panel-header">
      <div class="panel-name">${node.name}</div>
      <div class="panel-meta">${node.era} · <span style="color:${color}">${node.domain}</span></div>
    </div>
    <div class="panel-section">Concepts majeurs</div>
    <div class="panel-concepts">${node.concepts.map(c => `<div class="panel-concept">${c}</div>`).join('')}</div>
    ${descHTML}
    ${quotesHTML}
    ${bibHTML}
    ${outs.length ? `<div class="panel-section">Influence sur</div><div class="panel-nodes">${btns(outs)}</div>` : ''}
    ${ins.length  ? `<div class="panel-section">Influencé par</div><div class="panel-nodes">${btns(ins)}</div>`  : ''}
  `;

  document.querySelectorAll('.panel-node-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const n = nodeMap[btn.dataset.id];
      if (!n) return;
      openPanel(n);
      zoomTo(n.x + 120, n.y + 90);
    });
  });
}

async function openPanel(node) {
  const color = DATA.domains[node.domain] || '#64748b';
  const outs  = DATA.links.filter(([s])  => s === node.id).map(([,t]) => nodeMap[t]).filter(Boolean);
  const ins   = DATA.links.filter(([,t]) => t === node.id).map(([s])  => nodeMap[s]).filter(Boolean);

  // Affichage immédiat sans données enrichies
  renderPanel(node, color, outs, ins, {});
  document.getElementById('panel').classList.add('open');

  // Chargement asynchrone des fichiers data/{id}/
  const base = `data/${node.id}`;
  const [description, quotes, bibliography] = await Promise.all([
    fetchText(`${base}/description.md`),
    fetchJSON(`${base}/quotes.json`),
    fetchJSON(`${base}/bibliography.json`)
  ]);

  if (description || quotes || bibliography) {
    renderPanel(node, color, outs, ins, { description, quotes, bibliography });
  }
}

function closePanel() { document.getElementById('panel').classList.remove('open'); }

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  // SVG links
  const svg = document.getElementById('links-svg');
  DATA.links.forEach(([sid, tid]) => {
    const s = nodeMap[sid], t = nodeMap[tid];
    if (!s || !t) return;
    const sx = s.x + 120, sy = s.y + 90;
    const tx = t.x + 120, ty = t.y + 90;
    const mx = (sx + tx) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(0,0,0,0.45)');
    path.setAttribute('stroke-width', '3');
    path.dataset.s = sid;
    path.dataset.t = tid;
    svg.appendChild(path);
  });

  // Nodes
  const canvas = document.getElementById('canvas');
  DATA.nodes.forEach(node => {
    const color = DATA.domains[node.domain] || '#64748b';
    const el    = document.createElement('div');
    el.className   = 'node' + (node.type === 'concept' ? ' concept' : '');
    el.dataset.id  = node.id;
    el.style.left  = node.x + 'px';
    el.style.top   = node.y + 'px';
    el.style.borderColor = node.type === 'concept' ? color + '55' : '';
    if (node.type === 'author') el.style.boxShadow = `0 2px 20px ${color}1a`;

    el.innerHTML = `
      <div class="node-domain" style="background:${color}22;color:${color}">${node.domain}</div>
      <div class="node-name">${node.name}</div>
      <div class="node-era">${node.era}</div>
      <div class="node-tags">${node.concepts.map(c => `<div class="node-tag">${c}</div>`).join('')}</div>
    `;

    el.addEventListener('click', e => {
      e.stopPropagation();
      if (mode !== 'detail') return;
      openPanel(node);
    });

    canvas.appendChild(el);
  });

  // Legend
  const legend = document.getElementById('legend');
  Object.entries(DATA.domains).forEach(([domain, color]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${color}"></div>${domain}`;
    legend.appendChild(item);
  });

  applyTransform(false);
}

// ─── Events ───────────────────────────────────────────────────────────────────
const viewport = document.getElementById('viewport');

// Click: zoom in (overview) or close panel (detail)
viewport.addEventListener('click', e => {
  if (isDragging) return;
  if (mode === 'overview') {
    const s = overviewScale();
    const o = overviewOffset(s);
    zoomTo((e.clientX - o.x) / s, ((e.clientY - HEADER_H) - o.y) / s);
  } else {
    closePanel();
  }
});

// Double-click: zoom out (detail)
viewport.addEventListener('dblclick', e => {
  if (mode === 'detail') zoomOut();
});

// Drag (detail only)
viewport.addEventListener('mousedown', e => {
  if (mode !== 'detail') return;
  isDragging = false;
  dragStart  = { x: e.clientX, y: e.clientY };
  dragOrigin = { ...detailOffset };
});

document.addEventListener('mousemove', e => {
  if (mode === 'overview') {
    updateHoverRect(e.clientX, e.clientY - HEADER_H);
    return;
  }
  if (e.buttons !== 1) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (!isDragging && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
    isDragging = true;
    document.getElementById('viewport').classList.add('dragging');
  }
  if (isDragging) {
    detailOffset = { x: dragOrigin.x + dx, y: dragOrigin.y + dy };
    applyTransform(false);
  }
});

document.addEventListener('mouseup', () => {
  setTimeout(() => { isDragging = false; }, 0);
  document.getElementById('viewport').classList.remove('dragging');
});

viewport.addEventListener('mouseleave', () => {
  document.getElementById('hover-rect').style.display = 'none';
});

// Search
document.getElementById('search').addEventListener('input', e => applySearch(e.target.value));

// Panel close
document.getElementById('panel-close').addEventListener('click', closePanel);

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (mode === 'detail') { zoomOut(); return; }
    if (searchQuery) {
      const s = document.getElementById('search');
      s.value = '';
      applySearch('');
    }
  }
});

// Ctrl+molette : zoom fin en mode détail
viewport.addEventListener('wheel', e => {
  if (!e.ctrlKey || mode !== 'detail') return;
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = clamp(detailScale * factor, SCALE_MIN, SCALE_MAX);
  // Zoom centré sur la position de la souris
  const mouseX = e.clientX;
  const mouseY = e.clientY - HEADER_H;
  const canvasX = (mouseX - detailOffset.x) / detailScale;
  const canvasY = (mouseY - detailOffset.y) / detailScale;
  detailOffset = {
    x: mouseX - canvasX * newScale,
    y: mouseY - canvasY * newScale
  };
  detailScale = newScale;
  applyTransform(false);
}, { passive: false });

// Resize
window.addEventListener('resize', () => applyTransform(false));

// ─── Touch support ────────────────────────────────────────────────────────────
let lastTapTime = 0;

viewport.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  if (mode === 'overview') {
    updateHoverRect(touch.clientX, touch.clientY - HEADER_H);
  } else {
    isDragging = false;
    dragStart  = { x: touch.clientX, y: touch.clientY };
    dragOrigin = { ...detailOffset };
  }
}, { passive: false });

viewport.addEventListener('touchmove', e => {
  e.preventDefault();
  const touch = e.touches[0];
  if (mode === 'overview') {
    updateHoverRect(touch.clientX, touch.clientY - HEADER_H);
    return;
  }
  const dx = touch.clientX - dragStart.x;
  const dy = touch.clientY - dragStart.y;
  if (!isDragging && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
    isDragging = true;
    viewport.classList.add('dragging');
  }
  if (isDragging) {
    detailOffset = { x: dragOrigin.x + dx, y: dragOrigin.y + dy };
    applyTransform(false);
  }
}, { passive: false });

viewport.addEventListener('touchend', e => {
  document.getElementById('hover-rect').style.display = 'none';
  if (mode === 'detail') {
    const now = Date.now();
    if (!isDragging && now - lastTapTime < 300) {
      e.preventDefault();
      zoomOut();
      lastTapTime = 0;
      setTimeout(() => { isDragging = false; viewport.classList.remove('dragging'); }, 0);
      return;
    }
    lastTapTime = isDragging ? 0 : now;
  }
  setTimeout(() => { isDragging = false; viewport.classList.remove('dragging'); }, 0);
}, { passive: false });

  DATA = await fetchJSON('data/graph.json');
  if (!DATA) {
    document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">Erreur : impossible de charger data/graph.json</p>';
    return;
  }
  nodeMap = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
  init();
})();
